<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<title>Add a tip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0B0B0C; }
  body { color: #fff; font-family: Inter, system-ui, -apple-system, sans-serif; display: flex; justify-content: center; }
  .screen { width: 100%; max-width: 440px; min-height: 100dvh; display: flex; flex-direction: column; gap: 24px;
            padding: calc(48px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom)); }
  .head { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .name, .caption { margin: 0; font-size: 15px; color: #A1A1AA; }
  .name { font-weight: 500; }
  .caption { outline: none; cursor: text; min-width: 40px; padding: 2px 6px; border-radius: 6px; }
  .caption:focus { background: #232326; color: #fff; }
  .total { margin: 0; font-size: 52px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.05; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; text-align: center; letter-spacing: -0.5px; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  button { font-family: inherit; color: #fff; cursor: pointer; }
  .opt { width: 100%; height: 66px; border-radius: 14px; background: #232326; border: 2px solid transparent;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .opt.on { border-color: #fff; }
  .opt .label { font-size: 22px; font-weight: 600; }
  .opt .sub { font-size: 13px; color: #A1A1AA; }
  .custom { height: 56px; font-size: 17px; font-weight: 600; }
  .stepper { display: none; align-items: center; justify-content: space-between; gap: 12px; background: #18181A; border-radius: 14px; padding: 10px 12px; }
  .stepper.show { display: flex; }
  .stepper button { width: 48px; height: 48px; border: 0; border-radius: 12px; background: #232326; font-size: 26px; font-weight: 600; }
  .stepper span { font-size: 22px; font-weight: 600; }
  .spacer { flex-grow: 1; }
  .foot { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .wrong { margin: 0; font-size: 17px; font-weight: 600; color: #FF6B5E; visibility: hidden; }
  .wrong.show { visibility: visible; }
  .continue { width: 100%; height: 56px; border: 0; border-radius: 14px; background: #fff; color: #0B0B0C; font-size: 18px; font-weight: 600; }
  .notip { border: 0; background: none; color: #A1A1AA; font-size: 15px; font-weight: 500; text-decoration: underline; padding: 12px; }
</style>
</head>
<body>
<main class="screen">
  <div class="head">
    <p class="name">Raj Raina</p>
    <p class="total" id="total">$10.00</p>
    <p class="caption" id="caption" contenteditable="true" spellcheck="false" enterkeyhint="done">You're welcome</p>
  </div>
  <h1>Add a tip</h1>
  <div class="opts" id="opts"></div>
  <div class="spacer"></div>
  <div class="foot">
    <p class="wrong" id="wrong">Wrong answer. Try again.</p>
    <button class="continue" id="continue" type="button">Continue</button>
    <button class="notip" id="notip" type="button">No tip</button>
  </div>
</main>
<script>
  // ---- Edit these ----
  var CAPTION = "You're welcome";          // or use ?for=Helping%20you%20move in the URL
  var OPTIONS = [
    { id: '5',       label: '$5',              sub: "Don't be cheap",          amt: 5 },
    { id: '10',      label: '$10',             sub: 'Get a better job',        amt: 10 },
    { id: '20',      label: '$20',             sub: 'Almost there',            amt: 20 },
    { id: 'tuition', label: 'College Tuition', sub: "Now we're talking",       amt: 62000 }
  ];
  var CUSTOM_START = 25;
  var VENMO_USER = 'RajRaina';
  var VENMO_NOTE = 'Tip';
  // --------------------

  var params = new URLSearchParams(location.search);
  document.getElementById('caption').textContent = params.get('for') || CAPTION;

  var sel = '10', custom = CUSTOM_START;
  var fmt = function (n) { return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
  var opts = document.getElementById('opts');
  var wrong = document.getElementById('wrong');

  function render() {
    var amt = sel === 'custom' ? custom : OPTIONS.find(function (o) { return o.id === sel; }).amt;
    document.getElementById('total').textContent = fmt(amt);
    opts.querySelectorAll('[data-id]').forEach(function (b) { b.classList.toggle('on', b.dataset.id === sel); });
    stepper.classList.toggle('show', sel === 'custom');
    stepVal.textContent = fmt(custom);
  }
  function pick(id) { sel = id; wrong.classList.remove('show'); render(); }

  OPTIONS.forEach(function (o) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.dataset.id = o.id;
    b.innerHTML = '<span class="label"></span><span class="sub"></span>';
    b.querySelector('.label').textContent = o.label;
    b.querySelector('.sub').textContent = o.sub;
    b.onclick = function () { pick(o.id); };
    opts.appendChild(b);
  });

  var c = document.createElement('button');
  c.type = 'button'; c.className = 'opt custom'; c.dataset.id = 'custom'; c.textContent = 'Custom amount';
  c.onclick = function () { pick('custom'); };
  opts.appendChild(c);

  var stepper = document.createElement('div');
  stepper.className = 'stepper';
  stepper.innerHTML = '<button type="button" aria-label="Decrease">−</button><span></span><button type="button" aria-label="Increase">+</button>';
  var stepVal = stepper.querySelector('span');
  // both buttons only go up
  stepper.querySelectorAll('button').forEach(function (b) { b.onclick = function () { custom = Math.round(custom * 1.5); render(); }; });
  opts.appendChild(stepper);

  document.getElementById('continue').onclick = function () {
    var amt = sel === 'custom' ? custom : OPTIONS.find(function (o) { return o.id === sel; }).amt;
    location.href = 'https://venmo.com/' + VENMO_USER + '?txn=pay&amount=' + amt.toFixed(2) + '&note=' + encodeURIComponent(VENMO_NOTE);
  };

  var cap = document.getElementById('caption');
  cap.addEventListener('focus', function () {
    setTimeout(function () {
      var r = document.createRange(); r.selectNodeContents(cap);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }, 0);
  });
  cap.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); cap.blur(); } });

  document.getElementById('notip').onclick = function () { wrong.classList.add('show'); };
  render();
</script>
</body>
</html>
